<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
<title id="t">Institutional hero visual</title>
<desc id="d">Elegant architectural columns with a subtle globe motif.</desc>
<defs>
